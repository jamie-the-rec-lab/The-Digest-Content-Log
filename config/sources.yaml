# ============================================================================
# SOURCES: everything the weekly job tracks.
#
# All destinations are relative to the library/ folder, so "podcasts/transcripts"
# means library/podcasts/transcripts.
#
# Facts only. No verbs. This file says WHAT we look at, never what to do with
# it. If a line tells you to do something, it belongs in REFRESH.md,
# SELECTION.md or STYLE.md instead.
#
# TO ADD A PODCAST, copy this and fill it in:
#   - name: Show Name              # the folder name, and how it is remembered
#     display: Shown As            # only if readers should see a different name
#     url: [ 'https://...' ]         # always in square brackets, even if only one
#     brand: by Someone            # only if produced by a notable brand
#
# TO ADD A NEWSLETTER:
#   - name: Newsletter Name
#     sender: address@example.com
#     subscribe: https://...
#
# Note on names: a few sources are called one thing in the library and another
# on the page. The library name is the folder, and it is how an item is
# remembered so it never repeats. Where they differ, both are written below.
# ============================================================================


# ---------------------------------------------------------------------------
# RECRUITING PODCASTS
# ---------------------------------------------------------------------------
podcasts:
  destination: podcasts/transcripts

  shows:
    - name: 10x Recruiting
      url: [ 'https://www.youtube.com/@10x_Recruiting_pod/videos' ]
      brand: by Metaview

    - name: Brainfood
      url: [ 'https://www.youtube.com/channel/UCNJ1ECjprHORfyAbE5qyqcg/videos' ]
      cutoff: '20240101'

    - name: Building the Talent Machine
      url: [ 'https://www.youtube.com/@buildingthetalentmachine/videos' ]
      cutoff: '20240101'

    - name: Offer Accepted
      url: [ 'https://www.youtube.com/playlist?list=PLrd3ZPgPqLzmHvhgRKY0IH_5-1TuiDLDM' ]
      brand: by Ashby

    - name: PromptMates
      display: PromptMates Live
      url:
        - https://www.youtube.com/channel/UCBK-L-lWoLkSZw93S3f5VhQ/videos
        - https://www.youtube.com/channel/UCBK-L-lWoLkSZw93S3f5VhQ/streams

    - name: Recruiting Future
      url: [ 'https://www.youtube.com/user/mattalder1/videos' ]
      cutoff: '20240101'

    - name: Recruiting Roadshow
      url: [ 'https://www.youtube.com/playlist?list=PLGaFEEU4PKYwIQnkoGFLf3goOyeSudypy' ]
      brand: by Greenhouse

    - name: The Debrief
      url: [ 'https://www.youtube.com/@thedebriefTApodcast/videos' ]
      format: panel


# ---------------------------------------------------------------------------
# TECH ARCHIVE
# Kept separate from the recruiting library.
# ---------------------------------------------------------------------------
tech:
  destination: tech/transcripts

  shows:
    - name: AI & I
      url: [ 'https://www.youtube.com/playlist?list=PLuMcoKK9mKgHtW_o9h5sGO2vXrffKHwJL' ]
      brand: by Every
      host: Dan Shipper
      cadence: irregular
      cutoff: '20260101'

    - name: How I AI
      url: [ 'https://www.youtube.com/@howiaipodcast/videos' ]
      brand: by Lenny's Podcast
      host: Claire Vo
      cutoff: '20260101'

    - name: Lenny's Podcast
      url: [ 'https://www.youtube.com/@LennysPodcast/videos' ]

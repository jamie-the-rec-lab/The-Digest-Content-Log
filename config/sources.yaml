      cutoff: '20260101'


# ---------------------------------------------------------------------------
# NEWSLETTERS
# Found in Gmail by sender address.
# subscribe: the public link used when an issue has no archive URL of its own.
# ---------------------------------------------------------------------------
newsletters:
  destination: newsletters/transcripts

  titles:
    - name: Ashby Community
      sender: community@news.ashbyhq.com
      subscribe: https://try.ashbyhq.com/talent-trends-newsletter/
      public_archive: none

    - name: Data Driven Recruiter
      sender: data-driven-recruiter@mail.beehiiv.com
      subscribe: https://www.lukeeaton.com

    - name: Full Stack Recruiter
      sender: fullstackrecruiter@substack.com
      subscribe: https://newsletter.fullstackrecruiter.net/subscribe

    - name: PromptMates Newsletter
      sender: news@mail.promptmates.ai
      subscribe: https://promptmates.beehiiv.com/subscribe

    - name: RecOps Collective
      display: RecOps Roundup
      sender: recops@substack.com
      subscribe: https://recopscollective.substack.com/subscribe

    - name: Remade.md
      sender: remadebyleandro@substack.com
      subscribe: https://remadebyleandro.substack.com

    - name: TA Unboxed
      sender: taunboxed@substack.com
      subscribe: https://taunboxed.substack.com/subscribe


# ---------------------------------------------------------------------------
# PRODUCT LAUNCH VENDORS
# tier: a is favoured over b. What that means in practice is in SELECTION.md.
# type: rss is cleaner than page where both exist.
# search: no usable feed or page, so found by search instead.
# ---------------------------------------------------------------------------
launches:
  destination: news/transcripts

  vendors:
  - name: Ashby
    tier: a
    feed: https://www.ashbyhq.com/product-updates
    type: page

  - name: Eightfold
    tier: b
    feed: https://eightfold.ai/blog/topic/product-updates/feed/
    type: rss

  - name: First.cx
    tier: b
    feed: https://firststage.substack.com/feed
    type: rss
    backup: https://firststage.substack.com

  - name: Gem
    tier: a
    feed: https://www.gem.com/blog
    type: page

  - name: Greenhouse
    tier: a
    feed: https://support.greenhouse.io/hc/en-us/sections/360000710732-Release-notes
    type: page

  - name: hackajob
    tier: b
    type: search
    product: Archer

  - name: iCIMS
    tier: b
    feed: https://www.icims.com/en-gb/products/whats-new/
    type: page

  - name: Jack & Jill
    tier: a
    feed: https://www.jackandjill.ai/blog
    type: page

  - name: Juicebox
    tier: a
    feed: https://juicebox.ai/blog/product-updates
    type: page

  - name: Lever
    tier: b
    feed: https://help.lever.co/hc/en-us/sections/20087177899549-Product-Release-Notes
    type: page

  - name: Metaview
    tier: a
    feed: https://www.metaview.ai/resources/rss
    type: rss
    backup: https://www.metaview.ai/resources/product-updates

  - name: Nova
    tier: b
    type: search
    site: nova.dweet.com
    note: Nova by Dweet. A different company to Nova Talent.

  - name: Pin
    tier: a
    # blog.pin.com 404s and its backup served a stale 2024 cache. Verified
    # 11 Sep 2026: the live blog is www.pin.com/blog, which has no RSS feed and
    # is a general content hub, not a product-updates listing. Pointed at the
    # page that demonstrably works. NEEDS A FIX: find Pin's actual
    # product-updates section, do not guess a category URL.
    feed: https://www.pin.com/blog/
    type: page

  - name: Pinpoint
    tier: a
    feed: https://developers.pinpointhq.com/changelog.rss
    type: rss

  - name: Screenloop
    tier: b
    type: search

  - name: SmartRecruiters
    tier: b
    feed: https://www.smartrecruiters.com/recruiting-software/whats-new/
    type: page

  - name: Teamtailor
    tier: a
    feed: https://www.teamtailor.com/en/productnews/
    type: page

  - name: Workable
    tier: b
    feed: https://help.workable.com/hc/en-us/articles/360020051553-Workable-updates-and-release-notes
    type: page

  - name: Workday
    tier: b
    type: search
    scope: recruiting releases only


# ---------------------------------------------------------------------------
# REPORTS
# Reports need judgement, not just a list, so they keep their own documents.
# ---------------------------------------------------------------------------
reports:
  destination: reports/transcripts
  sources: library/reports/SOURCES.md
  watchlist: library/reports/WATCHLIST.md
  format: library/reports/FORMAT.md
  taxonomy: library/reports/TAXONOMY.md
  to_grab: library/reports/_TO_GRAB.md
  inbox: library/reports/_inbox/
